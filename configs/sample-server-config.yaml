inputs:
- tag: tag_alpha
  parse:
    type: regex
    exp: "(?s)^(?P<timestamp>\\w{3}\\s+\\d{1,2}\\s+\\d{2}:\\d{2}:\\d{2})\\s+(?P<host>[\\w-]+(?:\\s+[\\w-]+)*)\\s+(?P<process>[\\w-]+\\[\\d+\\])?:\\s+(?P<message>.+)$"
  produce:
  - type: http
    host: ""
    port: ""

- tag: tag_beta
  filter:
    rule: ""  
  produce:
  - type: kafka
    topic: topic-a

setting:
  host: "127.0.0.1"
  port: "4433"
  tls_cert_file: "cert/cert.pem"
  tls_key_file: "cert/key.pem"
